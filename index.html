<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Polyglot Tutor Pro - Document Reader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
</head>
<body class="bg-gray-100 min-h-screen font-sans pb-40">

    <div class="flex flex-col md:flex-row min-h-screen">
        <div class="hidden md:flex flex-col w-64 bg-white border-r border-gray-200 h-screen fixed left-0 top-0 z-20 overflow-y-auto">
            <div class="p-4 border-b bg-gray-50 flex justify-between items-center sticky top-0">
                <h2 class="font-bold text-gray-700"><i class="fa-solid fa-clock-rotate-left"></i> Lịch sử</h2>
                <button onclick="App.clearHistory()" class="text-xs text-red-500 hover:text-red-700">Xoá hết</button>
            </div>
            <div id="historyList" class="flex-1"></div>
        </div>

        <div class="flex-1 md:ml-64 p-4 md:p-8">
            <div class="max-w-4xl mx-auto">
                <h1 class="text-3xl font-extrabold text-center text-blue-800 mb-6 uppercase tracking-tight">
                    <i class="fa-solid fa-graduation-cap"></i> AI Language Tutor
                </h1>

                <div class="flex justify-center mb-6">
                    <div class="bg-white p-1 rounded-lg shadow-sm border inline-flex">
                        <button onclick="App.switchTab('tutor')" id="tabTutor" class="px-6 py-2 rounded-md font-bold text-sm bg-blue-100 text-blue-700 transition">
                            <i class="fa-solid fa-robot mr-2"></i> AI Giải Bài
                        </button>
                        <button onclick="App.switchTab('reader')" id="tabReader" class="px-6 py-2 rounded-md font-bold text-sm text-gray-600 hover:bg-gray-50 transition">
                            <i class="fa-solid fa-file-lines mr-2"></i> Phòng Đọc Tài Liệu
                        </button>
                    </div>
                </div>

                <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200 mb-6">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                        <div>
                            <label class="text-xs font-bold text-gray-500 uppercase">Nguồn AI</label>
                            <select id="provider" class="w-full p-2 border rounded mt-1 bg-gray-50">
                                <option value="deepseek">DeepSeek</option>
                                <option value="gemini">Google Gemini</option>
                                <option value="openai">ChatGPT</option>
                                
                            </select>
                        </div>
                        <div>
                            <label class="text-xs font-bold text-gray-500 uppercase">API Key</label>
                            <input type="password" id="apiKey" class="w-full p-2 border rounded mt-1" placeholder="Nhập API Key...">
                        </div>
                        <div>
                            <label class="text-xs font-bold text-gray-500 uppercase">Ngôn ngữ học</label>
                            <select id="targetLang" class="w-full p-2 border rounded mt-1 bg-gray-50">
                                <option value="Tiếng Nga" data-code="ru" data-dict="nga">🇷🇺 Tiếng Nga</option>
                                <option value="Tiếng Anh" data-code="en" data-dict="anh">🇺🇸 Tiếng Anh</option>
                                <option value="Tiếng Trung" data-code="zh" data-dict="trung">🇨🇳 Tiếng Trung</option>
                                <option value="Tiếng Nhật" data-code="ja" data-dict="nhat">🇯🇵 Tiếng Nhật</option>
                                <option value="Tiếng Hàn" data-code="ko" data-dict="han">🇰🇷 Tiếng Hàn</option>
                                <option value="Tiếng Pháp" data-code="fr" data-dict="phap">🇫🇷 Tiếng Pháp</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 border-t pt-4">
                        <div>
                            <label class="text-xs font-bold text-gray-500 uppercase">Giọng đọc (Voice)</label>
                            <select id="voiceSelect" class="w-full p-2 border rounded mt-1 bg-gray-50 text-sm">
                                <option value="">Mặc định (Auto)</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-xs font-bold text-gray-500 uppercase flex justify-between">
                                <span>Tốc độ đọc (Speed)</span>
                                <span id="speedValue" class="text-blue-600">1.0x</span>
                            </label>
                            <input type="range" id="rateInput" min="0.5" max="2" step="0.1" value="1" class="w-full mt-2 cursor-pointer accent-blue-600">
                        </div>
                    </div>
                </div>

                <!-- <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 mb-6 grid grid-cols-1 md:grid-cols-3 gap-4">

                    </div>

                <div id="viewTutor">
                    <div class="bg-white rounded-xl shadow-lg border border-gray-200 mb-6 overflow-hidden">
                        <div class="bg-gray-50 p-2 flex justify-between items-center border-b">
                            <div class="flex gap-2">
                                <button onclick="App.setMode('text')" id="btnText" class="px-3 py-1.5 bg-white border shadow-sm rounded text-sm font-bold text-blue-600">Văn bản</button>
                                <button onclick="App.setMode('image')" id="btnImage" class="px-3 py-1.5 bg-transparent text-gray-600 hover:bg-gray-200 rounded text-sm font-bold">Hình ảnh</button>
                            </div>
                            <button onclick="readQuestion()" class="text-blue-600 hover:bg-blue-50 px-3 py-1 rounded font-bold text-sm border border-blue-200 shadow-sm flex items-center gap-2">
                                <i class="fa-solid fa-volume-high"></i> Đọc đề
                            </button>
                        </div>
                        
                        <div class="p-4">
                            <textarea id="questionInput" class="w-full h-32 outline-none resize-y text-gray-700" placeholder="Nhập đề bài..."></textarea>
                            <div id="imageInputArea" class="hidden border-2 border-dashed border-gray-300 p-8 rounded-lg text-center bg-gray-50">
                                <input type="file" id="imageFile" accept="image/*" class="mx-auto">
                            </div>
                            <button id="btnSubmit" class="w-full mt-4 bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg shadow-md transition flex justify-center items-center gap-2">
                                🚀 GIẢI BÀI TẬP
                            </button>
                        </div>
                    </div>

                    <div id="resultArea" class="hidden bg-white p-6 rounded-xl shadow-xl border border-blue-100 relative min-h-[200px]">
                        <div class="flex justify-between items-center mb-4 border-b pb-2 sticky top-0 bg-white z-10">
                            <div class="flex items-center gap-3">
                                <h2 class="text-xl font-bold text-gray-800"><i class="fa-solid fa-book-open text-blue-600"></i> Lời giải</h2>
                                <button onclick="readAnswer()" class="text-green-600 bg-green-50 hover:bg-green-100 border border-green-200 px-3 py-1 rounded text-sm font-bold flex items-center gap-2 transition">
                                    <i class="fa-solid fa-circle-play"></i> Đọc lời giải
                                </button>
                            </div>
                            <button onclick="copyContent()" class="text-xs bg-gray-100 hover:bg-gray-200 px-3 py-1.5 rounded border font-bold text-gray-600 transition">
                                <i class="fa-regular fa-copy"></i> Copy
                            </button>
                        </div>
                        <div id="outputContent" class="prose max-w-none text-lg text-gray-800 leading-relaxed"></div>
                    </div>
                </div>

                <div id="viewReader" class="hidden">
                    <div class="bg-white rounded-xl shadow-lg border border-gray-200 mb-6 p-6">
                        <div class="border-2 border-dashed border-blue-300 bg-blue-50 rounded-xl p-8 text-center transition hover:bg-blue-100 cursor-pointer relative">
                            <input type="file" id="docInput" accept=".txt,.docx,.pdf" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" onchange="App.handleFileUpload(this)">
                            <i class="fa-solid fa-file-import text-4xl text-blue-500 mb-3"></i>
                            <p class="font-bold text-gray-700">Kéo thả hoặc Bấm để chọn file</p>
                            <p class="text-sm text-gray-500">Hỗ trợ: .TXT, .DOCX, .PDF</p>
                        </div>
                        <div class="mt-4 text-center">
                            <span class="text-gray-400 text-sm">- HOẶC -</span>
                        </div>
                        <textarea id="manualPaste" class="w-full mt-4 p-4 border rounded-lg h-32 focus:ring-2 focus:ring-blue-500" placeholder="Paste văn bản dài vào đây..."></textarea>
                        <button onclick="App.processManualText()" class="w-full mt-4 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-md">
                            📖 MỞ PHÒNG ĐỌC
                        </button>
                    </div>

                    <div id="readerArea" class="hidden bg-white p-8 rounded-xl shadow-xl border border-gray-200 min-h-[500px]">
                        <div class="flex justify-between items-center mb-6 border-b pb-4 sticky top-0 bg-white z-10">
                            <h2 class="text-2xl font-bold text-gray-800"><i class="fa-solid fa-file-lines text-blue-600"></i> Nội dung tài liệu</h2>
                            <div class="flex gap-2">
                                <button onclick="readDocument()" class="text-green-600 bg-green-50 hover:bg-green-100 border border-green-200 px-4 py-2 rounded font-bold flex items-center gap-2">
                                    <i class="fa-solid fa-circle-play"></i> Đọc ngay
                                </button>
                                <button onclick="App.clearReader()" class="text-red-500 bg-red-50 hover:bg-red-100 px-3 py-2 rounded font-bold">
                                    <i class="fa-solid fa-trash"></i> Xoá
                                </button>
                            </div>
                        </div>
                        <div id="readerContent" class="prose max-w-none text-lg text-gray-800 leading-relaxed font-serif whitespace-pre-wrap"></div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div id="audioPlayer" class="fixed bottom-0 left-0 w-full bg-white/95 backdrop-blur border-t shadow-[0_-5px_20px_rgba(0,0,0,0.1)] p-3 z-50 hidden flex flex-col md:flex-row justify-between items-center px-6 md:px-12 transition-transform duration-300">
        <div class="flex items-center gap-3 w-full md:w-auto mb-2 md:mb-0">
            <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
            <div class="text-sm font-bold text-gray-600 truncate max-w-[200px]" id="readingStatus">Sẵn sàng</div>
        </div>
        <div class="text-2xl flex items-center gap-6">
            <button onclick="window.TTS.startFromBeginning()" class="text-gray-400 hover:text-blue-600"><i class="fa-solid fa-backward-step"></i></button>
            <button id="btnPlay" class="w-12 h-12 bg-blue-600 text-white rounded-full flex items-center justify-center shadow-lg hover:scale-105 transition"><i class="fa-solid fa-play ml-1"></i></button>
            <button onclick="stopReading()" class="text-gray-400 hover:text-red-500"><i class="fa-solid fa-stop"></i></button>
        </div>
    </div>

    <div id="tooltip" class="fixed hidden bg-slate-800 text-white rounded-lg px-4 py-2 z-[9999] shadow-2xl flex gap-4 text-sm items-center border border-slate-600">
        <div class="absolute bottom-[-6px] left-1/2 -translate-x-1/2 w-3 h-3 bg-slate-800 rotate-45 border-r border-b border-slate-600"></div>
        <button id="btnSpeakSel" class="hover:text-yellow-400 flex flex-col items-center gap-1 group"><i class="fa-solid fa-volume-high"></i><span class="text-[10px]">NGHE</span></button>
        <div class="w-px h-6 bg-gray-600"></div>
        <button id="btnDict" class="hover:text-green-400 flex flex-col items-center gap-1 group"><i class="fa-solid fa-book-atlas"></i><span class="text-[10px]">V-TỪ ĐIỂN</span></button>
        <div class="w-px h-6 bg-gray-600"></div>
        <button id="btnGoogle" class="hover:text-blue-400 flex flex-col items-center gap-1 group"><i class="fa-brands fa-google"></i><span class="text-[10px]">GOOGLE</span></button>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/tts.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
